name: Release

# Builds the VSIX for a version tag and attaches it to a GitHub release. Publishing to the
# Marketplace only happens when a VSCE_PAT secret has been added to the repository.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run package
      - run: xvfb-run -a npm run test:e2e:vsix
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" codeneat.vsix --title "CodeNeat ${{ github.ref_name }}" --notes-file CHANGELOG.md
      - name: Publish to the Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        if: ${{ env.VSCE_PAT != '' }}
        run: npx vsce publish --packagePath codeneat.vsix
