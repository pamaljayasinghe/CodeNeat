name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Type check, lint, unit and integration tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run samples
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      # Formatters that are preinstalled on the runner (for example gofmt, rustfmt, clang-format,
      # terraform, swift-format on macOS) are exercised for real; the rest are reported as skipped.
      - run: npm run test:integration

  package:
    name: Build, package and end-to-end test
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: End-to-end tests against the packaged VSIX
        run: xvfb-run -a npm run test:e2e:vsix
      - uses: actions/upload-artifact@v4
        with:
          name: codeneat-vsix
          path: codeneat.vsix
          if-no-files-found: error
