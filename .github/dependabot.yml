# Dependabot checks once a week for new versions of the formatting engines and build tools, and
# opens a pull request for each update. Nothing changes until that pull request is reviewed,
# passes CI and is merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Major upgrades of build tools can need a newer Node.js or code changes, so they are done by
    # hand. Dependabot proposes compatible (minor and patch) updates only.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      formatting-engines:
        dependency-type: production
      build-tools:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
